<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>VELTRIX Tutorial</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">

            <span class="logo-mark">
                V
            </span>

            <span>
                VELTRIX
            </span>

        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#tutorial">
                Tutorial
            </a>

            <a href="index.html#help">
                Help
            </a>

        </div>

    </nav>



    <!-- Tutorial Page -->

    <main>

        <section class="tutorial-viewer">


            <!-- Back Button -->

            <div class="tutorial-top">

                <a
                    href="index.html#tutorial"
                    class="tutorial-back">

                    ← Back to VELTRIX Guide

                </a>

            </div>



            <!-- Tutorial Header -->

            <div class="tutorial-viewer-header">

                <div
                    id="tutorial-icon"
                    class="tutorial-viewer-icon">

                    🔐

                </div>


                <div>

                    <span
                        id="tutorial-category"
                        class="section-label">

                        VELTRIX TUTORIAL

                    </span>


                    <h1 id="tutorial-title">
                        Physical Lock
                    </h1>


                    <p id="tutorial-description">

                        Learn how to use the physical VELTRIX
                        smart door-lock system.

                    </p>

                </div>

            </div>



            <!-- Progress -->

            <div class="tutorial-progress-container">

                <div class="tutorial-progress-top">

                    <span>
                        Tutorial Progress
                    </span>

                    <span id="progress-text">
                        1 / 4
                    </span>

                </div>


                <div class="tutorial-progress-bar">

                    <div
                        id="progress-fill"
                        class="tutorial-progress-fill">
                    </div>

                </div>

            </div>



            <!-- Tutorial Content -->

            <section
                id="tutorial-content"
                class="tutorial-content">

            </section>



            <!-- Navigation -->

            <div class="tutorial-navigation">

                <button
                    id="previous-button"
                    class="secondary-button">

                    ← Previous

                </button>


                <button
                    id="next-button"
                    class="primary-button">

                    Next →

                </button>

            </div>


        </section>

    </main>



    <!-- Footer -->

    <footer>

        <div class="footer-logo">
            VELTRIX
        </div>

        <p>
            Smart. Secure. Dominate.
        </p>

        <p class="copyright">
            © 2026 VELTRIX
        </p>

    </footer>



    <script src="tutorial.js"></script>

</body>

</html>
